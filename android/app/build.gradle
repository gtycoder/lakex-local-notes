apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// 版本号单一来源 = 仓库根 package.json（与桌面 / Release 产物名一致，「关于」页读的也是它）。
// versionCode 由 semver 推导并加 1000 偏移：1002 起只会随版本单调递增（本机既有安装是 3）；
// 不要改回小于上一版的号码 —— Android 会以 INSTALL_FAILED_VERSION_DOWNGRADE 拒绝覆盖安装。
def appSemver = (rootProject.file('../package.json').text =~ /"version"\s*:\s*"([0-9]+)\.([0-9]+)\.([0-9]+)"/)
def appVersionName = '0.0.0'
def appVersionCode = 1000
if (appSemver.find()) {
    def major = appSemver.group(1) as int
    def minor = appSemver.group(2) as int
    def patch = appSemver.group(3) as int
    appVersionName = major + '.' + minor + '.' + patch
    appVersionCode = 1000 + major * 10000 + minor * 100 + patch
}

// Android 正式签名：CI 从 GitHub Secrets 解码 keystore 后通过环境变量注入。
// 本地未设置时回退 debug 签名（仅用于开发/未配置环境；CI 会强制要求 release secrets）。
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath?.trim() &&
    releaseKeystorePassword?.trim() &&
    releaseKeyAlias?.trim() &&
    releaseKeyPassword?.trim() &&
    rootProject.file(releaseKeystorePath).isFile()

android {
    namespace = "com.lakexlocalnotes.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.lakexlocalnotes.android"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // SEC-03：release 变体必须配置签名，否则只能发 debug 包（android:debuggable=true ⇒
            // 任何装机者可 run-as 读私有目录里的明文笔记，也能给 WebView 挂调试器注入 JS）。
            // 这里用 debug keystore 签：签名强度不变，但 debuggable=false 立刻生效；
            // 正式发布换 release keystore 时只改这一行（+ 在 CI 注入对应 secrets）。
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            // 维持 false：R8/Capacitor 反射面未验证，收紧混淆不在本轮范围。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
