<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>LakexLocalNotes</title>
  <style>
    /* 启动页（261115）：为 UA 自绘表面声明色彩模式，并用 light-dark() 取色 ——
       修 docs/MODERN-WEB-AUDIT.md A26/A27（深色系统下滚动条/画布仍是浅色）。 */
    :root { color-scheme: light dark; }
    /* 261120 用户点单「都统一白色」：浅色档启动底 = 纯白（深色档保持 #1e2126，避免深色系统白闪）。 */
    html, body { height: 100%; margin: 0; overflow: hidden; background: light-dark(#ffffff, #1e2126); }
    body {
      display: grid;
      place-items: center;
      font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-app-region: drag;
      cursor: default;
    }
    .boot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    /* 261120 用户点单：桌面启动页**只留绿色折纸**（去掉薄荷圆形底盘）。
       boot-poster.png 现为透明底折纸（与 public/brand/14a-paper-finch-mark.png 同一份）；
       原来的带动画 APNG 也带圆盘 ⇒ 一并删除（省 328KB）。入场只做 250ms 淡入。 */
    .boot__mark {
      display: block;
      width: 128px;
      height: 128px;
      animation: boot-in 250ms ease-out both;
    }
    .boot__label { color: light-dark(#6f7784, #9aa4b2); font-size: 13px; line-height: 1.5; }
    @keyframes boot-in {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot__mark { animation: none; }
    }
  </style>
</head>
<body>
  <div class="boot" role="status" aria-live="polite">
    <!-- 261120：只留透明底绿色折纸（原来的 APNG/圆盘 poster 都带薄荷圆底，已删）。
         装饰图 alt=""（状态由下方 label 播报），避免读屏念出文件名。 -->
    <img class="boot__mark" src="boot-poster.png" alt="" width="128" height="128" />
    <span class="boot__label">正在打开本地知识库</span>
  </div>
</body>
</html>
