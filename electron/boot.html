<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>LakexLocalNotes</title>
  <style>
    /* 启动页（261115）：为 UA 自绘表面声明色彩模式，并用 light-dark() 取色 ——
       修 docs/MODERN-WEB-AUDIT.md A26/A27（深色系统下滚动条/画布仍是浅色）。 */
    :root { color-scheme: light dark; }
    html, body { height: 100%; margin: 0; overflow: hidden; background: light-dark(#f3f4f6, #1e2126); }
    body {
      display: grid;
      place-items: center;
      font-family: "MiSans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-app-region: drag;
      cursor: default;
    }
    .boot { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .boot__anim { display: block; width: 128px; height: 128px; }
    .boot__poster { display: none; width: 128px; height: 128px; }
    .boot__label { color: light-dark(#6f7784, #9aa4b2); font-size: 13px; line-height: 1.5; }
    @media (prefers-reduced-motion: reduce) {
      .boot__anim { display: none; }
      .boot__poster { display: block; }
    }
  </style>
</head>
<body>
  <div class="boot" role="status" aria-live="polite">
    <!-- 261115：APNG/PNG 从内联 data URI 挪成独立文件（原 HTML 476KB → ~1.3KB）。
         装饰图 alt=""（状态由下方 label 播报），避免读屏念出文件名。 -->
    <img class="boot__anim" src="boot-anim.apng" alt="" width="128" height="128" />
    <img class="boot__poster" src="boot-poster.png" alt="" width="128" height="128" />
    <span class="boot__label">正在打开本地知识库</span>
  </div>
</body>
</html>
